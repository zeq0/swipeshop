<script>
(function(){

var parts=[],pgeo=new THREE.SphereGeometry(0.07,6,6),pIdx=0;

scene.add(ball);
var glow=new THREE.PointLight(0xff4fa3,1.6,14);scene.add(glow);
var halo=new THREE.Mesh(new THREE.RingGeometry(0.62,0.76,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));halo.rotation.x=-Math.PI/2;scene.add(halo);

var NS=150,starPos=new Float32Array(NS*3);for(var q2=0;q2<NS*3;q2+=3){starPos[q2]=rnd(-30,30);starPos[q2+1]=rnd(1,14);starPos[q2+2]=rnd(-30,30)}

function addSeg(first){
  var d=ex+ez,dr=segCount%2;
  var len=first?7:rnd(Math.max(2.2,3.6-d*0.004),Math.max(3.6,7.5-d*0.014));
  var w=first?2.8:Math.max(1.3,2.6-d*0.006);
  var x1=ex+(dr===0?len:0),z1=ez+(dr===1?len:0);
  var kind=0;if(!first&&d>12){var r=Math.random();kind=r<0.3?1:r<0.52?2:(r<0.66&&d>60)?3:0}
  var mat=new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(hueAt(d)+(kind===1?0.05:0),0.5,0.56+(segCount%2)*0.05),transparent:kind===3});
  var g=new THREE.Group(),cx=(ex+x1)/2,cz=(ez+z1)/2,L=len+w;

    for(var i=0;i<n;i++){var k=new THREE.Mesh(new THREE.BoxGeometry(dr===0?tl-0.1:w,0.6,dr===0?w:tl-0.1),mat);
      var o=-L/2+tl*(i+0.5);k.position.set(dr===0?o:0,0,dr===0?0:o);g.add(k)}}
  else g.add(new THREE.Mesh(new THREE.BoxGeometry(dr===0?L:w,0.6,dr===0?w:L),mat));
  g.position.set(cx,-0.3,cz);scene.add(g);
  var s={g:g,mat:mat,kind:kind,dr:dr,w:w,s:d,cx:cx,cz:cz,a:(dr===0?ex:ez)-w/2,b:(dr===0?x1:z1)+w/2,minX:0,maxX:0,minZ:0,maxZ:0};
  if(!first&&d>30&&Math.random()<0.4){
    var gm=new THREE.Mesh(new THREE.BoxGeometry(dr===0?2.4:w,0.6,dr===0?w:2.4),new THREE.MeshLambertMaterial({color:mat.color,transparent:true,opacity:0.72}));
    gm.position.set(x1+(dr===0?w/2+1.2:0),-0.3,z1+(dr===1?w/2+1.2:0));scene.add(gm);s.ghost=gm}
  if(!first){var p=Math.random(),pk=null;
    if(p<0.38)pk={t:0,m:new THREE.Mesh(new THREE.OctahedronGeometry(0.22),new THREE.MeshBasicMaterial({color:0x5ff2ff}))};
    else if(p<0.48&&d>30)pk={t:2,m:new THREE.Mesh(new THREE.OctahedronGeometry(0.22),new THREE.MeshBasicMaterial({color:0xff5f9a}))};
    else if(p<0.58&&d>15)pk={t:1,m:new THREE.Mesh(new THREE.IcosahedronGeometry(0.3),new THREE.MeshStandardMaterial({color:0xb27bff,emissive:0xff9bf0,emissiveIntensity:0.7}))};
    if(!pk&&p>=0.58&&p<0.8){var hp=Math.random();
      if(false){}
      else if(hp<0.55&&d>10)pk={t:4,m:new THREE.Mesh(new THREE.TorusGeometry(0.2,0.08,8,14),new THREE.MeshBasicMaterial({color:0xffd24a}))};
      else if(hp<0.62&&d>20)pk={t:5,m:new THREE.Mesh(new THREE.ConeGeometry(0.25,0.55,4),new THREE.MeshBasicMaterial({color:0xff8a2a}))};else if(hp<0.7&&d>25)pk={t:6,m:new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),new THREE.MeshStandardMaterial({color:0x6ab7ff,emissive:0x2a8cff,emissiveIntensity:0.8}))};else if(hp<0.97&&d>15&&segCount-lastStar>12)pk={t:7,m:new THREE.Mesh(starGeo2(),new THREE.MeshBasicMaterial({color:0xffe14a}))}}
    if(pk){if(pk.t===7)lastStar=segCount;pk.m.position.set(cx,0.85,cz);scene.add(pk.m);s.pick=pk}}

}
function kill(s){scene.remove(s.g);s.g.children.forEach(function(c){c.geometry.dispose()});s.mat.dispose();

var slowT=0,wideT=0,fogT=0,fastT=0,bonus=0,band=0,tm=0,tr=0,gw=1,surgeT=0,dizzyT=0,shake=0,nextSurge=60,baseFov=45,combo=0,shieldOn=false,magnetT=0,autoT=0,aiT=0,paused=false,revives=0,lastStar=-99,lastAn=0,guideT=0,readyT=0,lastRn=-1;

  segs.forEach(kill);segs=[];ex=0;ez=0;segCount=0;bx=0;bz=0;by=0.38;dir=0;vy=0;fallT=0;
  slowT=wideT=fogT=fastT=bonus=band=surgeT=dizzyT=shake=0;nextSurge=60;combo=0;shieldOn=false;magnetT=0;autoT=0;aiT=0;revives=0;lastStar=-99;guideT=0;lastAn=0;setShape(0);

}

/* ---------- Music ---------- */
var ac=null,master,delay,muted=false,nextT=0,step=0,timer=null;
var penta=[261.63,293.66,329.63,392,440,523.25,587.33];
var chords=[[110,164.81,220,261.63],[87.31,130.81,174.61,220],[130.81,196,261.63,329.63],[98,146.83,196,246.94]];
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:0.5;master.connect(ac.destination);
    delay=ac.createDelay(1);delay.delayTime.value=0.42;
    var fb=ac.createGain();fb.gain.value=0.42;var dg=ac.createGain();dg.gain.value=0.5;
    delay.connect(fb);fb.connect(delay);delay.connect(dg);dg.connect(master);
    nextT=ac.currentTime+0.1;
    timer=setInterval(sched,120);
  }catch(e){ac=null}
}
function pluck(f,t,v){
  var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0008,t+1.6);
  o.connect(g);g.connect(master);g.connect(delay);o.start(t);o.stop(t+1.7);
}
function pad(fs,t){
  var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(master);
  fs.forEach(function(f){
    var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.07,t+2.2);g.gain.linearRampToValueAtTime(0,t+7.5);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+7.6);
  });
}
function sched(){
  if(!ac)return;
  var it=Math.min(dist()/200,1),gap=Math.max(0.22,0.55-it*0.3);
  while(nextT<ac.currentTime+0.4){
    if(step%12===0)pad(chords[(step/12)%chords.length],nextT);
    if(it>0.1&&step%2===0)kick(nextT,0.2+it*0.3);if(it>0.3&&step%2===1)hat(nextT);if(Math.random()<0.7+it*0.3)pluck(penta[(Math.random()*penta.length)|0]*(Math.random()<0.2?2:1),nextT,0.09);
    nextT+=gap;step++;
  }
}
function kick(t,v){var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.25)}
function hat(t){var n=ac.sampleRate*0.05,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;var g=ac.createGain();g.gain.value=0.08;s.connect(f);f.connect(g);g.connect(master);s.start(t)}
function tapSound(){if(!ac)return;pluck(penta[(Math.random()*penta.length)|0]*2,ac.currentTime,0.12)}
function collectSound(){if(!ac)return;var t=ac.currentTime;pluck(880,t,0.13);pluck(1318.5,t+0.09,0.11)}
function whoosh(){if(!ac)return;var t=ac.currentTime,n=ac.sampleRate*1.2,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=Math.random()*2-1;var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+1);var g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.25,t+0.5);g.gain.linearRampToValueAtTime(0,t+1.2);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
function chime(){if(!ac)return;var t=ac.currentTime;[784,1046.5,1568].forEach(function(f,i){pluck(f,t+i*0.06,0.13)})}
function sparkle(){if(!ac)return;var t=ac.currentTime;[523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){pluck(f,t+i*0.07,0.1)})}
function trapSound(){if(!ac)return;var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+0.5);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.6)}
function fallSound(){if(!ac)return;var t=ac.currentTime;pluck(196,t,0.14);pluck(146.83,t+0.15,0.12)}

var overEl=document.getElementById('over'),overScore=document.getElementById('overScore'),btnRetry=document.getElementById('btnRetry'),btnCont=document.getElementById('btnCont'),adEl=document.getElementById('ad'),adTimer=document.getElementById('adTimer'),adSkip=document.getElementById('adSkip'),pauseBtn=document.getElementById('pause'),adOn=false;

btnRetry.addEventListener('pointerdown',function(e){e.stopPropagation();startAd(function(){reset();state='play';msg.innerHTML='';bestEl.textContent='الأفضل: '+best})});
function revive(){var d=dist(),tgt=null;for(var u=0;u<segs.length;u++){if(segs[u].s<=d)tgt=segs[u]}if(!tgt)tgt=segs[0];
  bx=Math.min(Math.max(bx,tgt.minX+0.5),tgt.maxX-0.5);bz=Math.min(Math.max(bz,tgt.minZ+0.5),tgt.maxZ-0.5);dir=tgt.dr;by=0.38;vy=0;fallT=0;revives++;guideT=3;readyT=3;lastRn=-1;state='play';emit(bx,by,bz,30,5,0.45);toast('استمرار! اضغط عند العمود المضيء')}
btnCont.addEventListener('pointerdown',function(e){e.stopPropagation();
  adOn=true;adEl.style.display='flex';var n=5;adSkip.disabled=true;adSkip.textContent='انتظر '+n;adTimer.style.transition='none';adTimer.style.width='0%';
  setTimeout(function(){adTimer.style.transition='width 1s linear';adTimer.style.width='20%'},30);
  var iv=setInterval(function(){n--;adTimer.style.width=((5-n)*20)+'%';if(n<=0){clearInterval(iv);adSkip.disabled=false;adSkip.textContent='✅ متابعة اللعب'}else adSkip.textContent='انتظر '+n},1000)});
adSkip.addEventListener('pointerdown',function(e){e.stopPropagation();if(adSkip.disabled)return;adEl.style.display='none';adOn=false;overEl.style.display='none';(adAction||revive)();adAction=null});
/* ---------- Input ---------- */
function tap(){if(paused||adOn||aiT>0||readyT>0)return;
  if(state==='ready'){initAudio();if(ac&&ac.state==='suspended')ac.resume();state='play';msg.innerHTML='';return}
  if(state==='play'){
    var c=dir===0?bx:bz,perf=false;
    for(var i=0;i<segs.length;i++){var s=segs[i];if(s.dr===dir&&bx>=s.minX&&bx<=s.maxX&&bz>=s.minZ&&bz<=s.maxZ){if(Math.abs(c-(s.b-s.w/2))<0.55){combo++;bonus+=2*Math.min(combo,8);shake=0.2+combo*0.03;toast('🎯 مثالي ×'+combo);perf=true;emit(bx,by,bz,14,3.5,0.15);chime()}break}}
    if(!perf)combo=0;dir=1-dir;pulse=1;tapSound();emit(bx,by,bz,8,2.5);return}
  if(false){reset();state='play';msg.innerHTML='';bestEl.textContent='الأفضل: '+best}
}
addEventListener('pointerdown',function(e){e.preventDefault();tap()},{passive:false});
addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();tap()}});

/* ---------- Loop ---------- */
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var rdt=paused?0:Math.min((now-last)/1000,0.05),dt=rdt;last=now;
  if(readyT>0){readyT-=rdt;dt=0;var rn=Math.ceil(readyT);if(rn!==lastRn||!msg.innerHTML){lastRn=rn;msg.innerHTML=rn>0?'<h1>'+rn+'</h1><p>استعد!</p>':''}if(readyT<=0)readyT=0}
  tm+=rdt;
  var d=dist();
  slowT=Math.max(0,slowT-dt);wideT=Math.max(0,wideT-dt);fogT=Math.max(0,fogT-dt);fastT=Math.max(0,fastT-dt);surgeT=Math.max(0,surgeT-dt);magnetT=Math.max(0,magnetT-dt);autoT=Math.max(0,autoT-dt);guideT=Math.max(0,guideT-dt);dizzyT=Math.max(0,dizzyT-dt);shake=Math.max(0,shake-dt*1.5);
  gw+=((wideT>0?1.25:1)-gw)*Math.min(1,dt*5);
  var fg=scene.fog;
  if(state==='play'||state==='fall'){
    var sp=(6+Math.min(d*0.025,7))*(slowT>0?0.6:1)*(fastT>0?1.5:1)*(surgeT>0?1.35:1)*(autoT>0?1.6:1)*(aiT>0?1.8:1);
    if(state==='fall')sp*=0.5;
    if(dir===0)bx+=sp*dt;else bz+=sp*dt;
  }
  if(aiT>0&&state==='play'){aiT=Math.max(0,aiT-dt);var an=Math.ceil(aiT);if(aiT<=3&&an>0&&an!==lastAn){lastAn=an;toast('استعد '+an)}
    for(var a=0;a<segs.length;a++){var sa=segs[a];
      if(sa.dr===dir&&bx>=sa.minX-0.2&&bx<=sa.maxX+0.2&&bz>=sa.minZ-0.2&&bz<=sa.maxZ+0.2){
        if(dir===0)bz+=(sa.cz-bz)*Math.min(1,dt*8);else bx+=(sa.cx-bx)*Math.min(1,dt*8);
        if((dir===0?bx:bz)>=sa.b-sa.w/2-0.12){dir=1-dir;pulse=1;emit(bx,by,bz,10,3,0.55);tapSound()}
        break}}
    if(aiT===0){slowT=Math.max(slowT,1.5);guideT=3.5;readyT=3;lastRn=-1;toast('🎮 الآن دورك! اضغط عند العمود المضيء')}}
  var ok=false;
  for(var i=0;i<segs.length;i++){var s=segs[i];
    var f=(s.kind===2?0.8+0.2*Math.sin(tm*1.8+s.s):1)*gw,hw=s.w*f/2;
    if(s.dr===0){s.g.scale.z=f;s.minX=s.a;s.maxX=s.b;s.minZ=s.cz-hw;s.maxZ=s.cz+hw}
    else{s.g.scale.x=f;s.minZ=s.a;s.maxZ=s.b;s.minX=s.cx-hw;s.maxX=s.cx+hw}
    if(s.kind===1)s.g.children.forEach(function(c,n){c.position.y=-Math.abs(Math.sin(tm*2.5+n*0.8))*0.12});
    if(s.ghost)s.ghost.material.opacity=0.62+0.12*Math.sin(tm*3);
    if(s.pick){var m=s.pick.m;m.rotation.y+=dt*2.5;m.position.y=0.85+Math.sin(tm*3+s.s)*0.12;
      if(magnetT>0&&s.pick.t===0&&state==='play'){var mx=bx-m.position.x,mz=bz-m.position.z,md=Math.sqrt(mx*mx+mz*mz);if(md<7&&md>0.01){var mv=Math.min(1,dt*14)*0.5;m.position.x+=mx*mv;m.position.z+=mz*mv}}
      if(state==='play'){var dx=bx-m.position.x,dz=bz-m.position.z;
        if(dx*dx+dz*dz<0.9&&!((s.pick.t===7||s.pick.t===2)&&aiT>0)){emit(m.position.x,0.8,m.position.z,16,3,s.pick.t?0.8:0.5);collectSound();
          if(s.pick.t===1){mystery();sparkle()}else if(s.pick.t===2){dizzyT=5;fastT=3;shake=0.5;trapSound();toast('😵 فخ! الرؤية تدور')}else if(s.pick.t===4){magnetT=8;sparkle();toast('🧲 مغناطيس الجواهر')}else if(s.pick.t===5){surgeT=3;shake=0.4;bonus+=5;whoosh();toast('🚀 دفعة سرعة!')}else if(s.pick.t===7){aiT=5;dizzyT=0;sparkle();whoosh();shake=0.5;toast('⭐ الذكاء الاصطناعي يلعب ٥ ثوانٍ!')}else if(s.pick.t===6){autoT=5;sparkle();whoosh();shake=0.5;toast('⚡ تسريع عالٍ ٥ ثوانٍ — التحكم بيدك!')}else bonus+=3*Math.max(1,Math.min(combo,4));
          scene.remove(m);m.geometry.dispose();m.material.dispose();s.pick=null}}}
    var on=true;if(s.kind===3){var sv=Math.sin(tm*2.2+s.s);on=sv>-0.6;s.mat.opacity=on?(sv<-0.3?0.5:1):0.12}
    if(on&&bx>=s.minX-0.1&&bx<=s.maxX+0.1&&bz>=s.minZ-0.1&&bz<=s.maxZ+0.1)ok=true;
  }
  if(state==='play'){
    
    if(aiT>0)ok=true;
    if(!ok&&shieldOn){shieldOn=false;var tgt=null;for(var u=0;u<segs.length;u++){if(segs[u].s<=d)tgt=segs[u]}
      if(tgt){bx=Math.min(Math.max(bx,tgt.minX+0.5),tgt.maxX-0.5);bz=Math.min(Math.max(bz,tgt.minZ+0.5),tgt.maxZ-0.5);dir=tgt.dr}
      emit(bx,by,bz,30,5,0.45);shake=0.5;whoosh();toast('🛡️ أنقذك الدرع!');ok=true}
    if(!ok){state='fall';vy=0;fallT=0;fallSound();emit(bx,by,bz,40,5);shake=0.9}
    var sc=Math.floor(d/2)+bonus;scoreEl.textContent=sc;
    if(d>nextSurge){nextSurge=d+rnd(50,80);surgeT=5;shake=0.4;whoosh();toast('🔥 اندفاع!')}
    var nb=Math.floor(sc/25);
    if(nb>band){band=nb;setShape(shapeI+1);emit(bx,by,bz,22,4);toast('🔮 شكل جديد')}
  }
  if(state==='fall'){
    vy-=22*dt;by+=vy*dt;fallT+=dt;
    if(fallT>1){
      state='over';overT=0;var fs=Math.floor(d/2)+bonus;
      if(fs>best){best=fs;try{localStorage.setItem('calmpath_best',best)}catch(e){}}
      overUI('النتيجة: '+fs+' · الأفضل: '+best,'اضغط للمحاولة مجدداً');
    }
  }
  if(state==='over')overT+=dt;
  var idx=0;for(var j=0;j<segs.length;j++){if(segs[j].s<=d)idx=j;else break}
  while(segs.length-idx<14)addSeg();
  while(idx>4){kill(segs.shift());idx--}
  pulse=Math.max(0,pulse-dt*3);var k=1+pulse*0.25;
  ball.scale.set(k,k,k);ball.position.set(bx,by,bz);ball.rotation.x+=dt*3;ball.rotation.z+=dt*1.7;
  var h=hueAt(d),bh=(tm*0.12)%1;ball.material.color.setHSL(bh,0.85,0.62);ball.material.emissive.setHSL((bh+0.08)%1,0.9,0.5);
  glow.color.copy(ball.material.emissive);glow.position.set(bx,by+1.2,bz);
  halo.position.set(bx,by-0.33,bz);halo.material.color.copy(ball.material.color);halo.scale.setScalar(1+0.12*Math.sin(tm*6)+pulse*0.4);
  bubble.visible=shieldOn;
  guide.visible=false;
  if((aiT>0&&aiT<=3)||guideT>0){for(var gi=0;gi<segs.length;gi++){var sg=segs[gi];if(sg.dr===dir&&bx>=sg.minX-0.3&&bx<=sg.maxX+0.3&&bz>=sg.minZ-0.3&&bz<=sg.maxZ+0.3){var cr=sg.b-sg.w/2;guide.position.set(dir===0?cr:sg.cx,1.5,dir===0?sg.cz:cr);guide.visible=true;var gs=1+0.15*Math.sin(tm*10);guide.scale.set(gs,1,gs);break}}}bubble.position.copy(ball.position);bubble.scale.setScalar(1+0.06*Math.sin(tm*8));
  for(var si=0;si<NS*3;si+=3){var sx=starPos[si]-bx,sz=starPos[si+2]-bz;if(sx<-30)starPos[si]+=60;else if(sx>30)starPos[si]-=60;if(sz<-30)starPos[si+2]+=60;else if(sz>30)starPos[si+2]-=60;starPos[si+1]+=dt*(0.4+(surgeT>0?2:0));if(starPos[si+1]>14)starPos[si+1]=1}
  starGeo.attributes.position.needsUpdate=true;
  tr+=dt;if(tr>(surgeT>0||autoT>0||aiT>0?0.015:0.035)&&state!=='ready'&&state!=='over'){tr=0;emit(bx,by-0.1,bz,2,0.6,bh)}
  parts.forEach(function(p){if(!p.m.visible)return;p.l-=dt*1.5;if(p.l<=0){p.m.visible=false;return}
    p.v.y-=3*dt;p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(p.l);p.m.material.opacity=p.l});
  fxEl.style.opacity=Math.min(1,(surgeT>0||autoT>0||aiT>0?0.7:0)+Math.min(combo,8)*0.07);statusEl.textContent=(aiT>0?'⭐'+Math.ceil(aiT)+' ':'')+(autoT>0?'⚡'+Math.ceil(autoT)+' ':'')+(shieldOn?'🛡️ ':'')+(magnetT>0?'🧲'+Math.ceil(magnetT)+' ':'')+(combo>1?'🎯×'+combo+' ':'')+(slowT>0?'⏳ ':'')+(wideT>0?'🌉 ':'')+(surgeT>0?'🔥':'');
  scene.background.setHSL(h,0.4,0.2);fg.color.setHSL(h,0.4,0.2);
  focus.x+=(bx+1-focus.x)*Math.min(1,dt*4);focus.z+=(bz+1-focus.z)*Math.min(1,dt*4);
  camera.position.set(focus.x-7.5+(Math.random()-0.5)*shake,9.5+(Math.random()-0.5)*shake,focus.z-7.5);
  camera.up.set(dizzyT>0?Math.sin(tm*2)*0.6:0,1,0);camera.lookAt(focus.x,0,focus.z);
  camera.fov+=((baseFov+Math.min(d*0.03,8)+(surgeT>0||autoT>0||aiT>0?7:0))-camera.fov)*Math.min(1,dt*3);camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}
reset();bestEl.textContent=best?'الأفضل: '+best:'';
showMsg('الدرب المتقلب','اضغط عند الزاوية بالضبط لضربة مثالية · احذر الألواح الوهمية والجواهر الوردية · 🧲🚀⭐ وسائل مساعدة','اضغط للبدء');
requestAnimationFrame(loop);
})();
